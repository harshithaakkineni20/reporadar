[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reporadar"
version = "0.1.0"
description = "Early-signal ranking system for emerging GitHub repositories."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "RepoRadar Contributors" }]
dependencies = []

[project.optional-dependencies]
app = [
  "pandas>=2.2",
  "plotly>=5.22",
  "streamlit>=1.35"
]
ml = [
  "numpy>=1.26",
  "pandas>=2.2",
  "scikit-learn>=1.5"
]
dev = [
  "ruff>=0.5",
  "pytest>=8.0"
]

[project.scripts]
reporadar = "reporadar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
